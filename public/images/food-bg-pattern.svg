<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none">
  <g stroke="#b21e23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- pizza -->
    <g transform="translate(48 52) rotate(-12)">
      <path d="M8 36 L28 8 L48 36 Z" fill="none"/>
      <circle cx="22" cy="28" r="2" fill="#b21e23" stroke="none"/>
      <circle cx="32" cy="24" r="2" fill="#e85c1a" stroke="none"/>
      <circle cx="18" cy="22" r="2" fill="#b21e23" stroke="none"/>
    </g>
    <!-- croissant -->
    <g transform="translate(560 88) rotate(18)">
      <path d="M6 24 C14 8 34 8 42 24 C34 30 14 30 6 24 Z" fill="none"/>
      <path d="M12 22 C18 14 30 14 36 22"/>
    </g>
    <!-- cannoli -->
    <g transform="translate(320 40) rotate(8)">
      <rect x="4" y="14" width="40" height="14" rx="7" fill="none"/>
      <path d="M8 21 C16 18 32 18 40 21"/>
    </g>
    <!-- gelato -->
    <g transform="translate(180 140) rotate(-16)">
      <path d="M18 8 L28 34 L8 34 Z" fill="none"/>
      <path d="M8 34 C8 40 28 40 28 34"/>
    </g>
    <!-- coffee -->
    <g transform="translate(620 220) rotate(-8)">
      <path d="M8 14 H32 V30 C32 36 8 36 8 30 Z" fill="none"/>
      <path d="M32 18 H36 C40 18 40 26 36 26 H32"/>
      <path d="M12 38 C14 42 26 42 28 38"/>
    </g>
    <!-- olive branch -->
    <g transform="translate(88 260) rotate(22)">
      <path d="M6 30 C20 24 28 10 38 6"/>
      <ellipse cx="18" cy="22" rx="4" ry="6" fill="none"/>
      <ellipse cx="28" cy="14" rx="4" ry="6" fill="none"/>
    </g>
    <!-- arancini -->
    <g transform="translate(420 180) rotate(-20)">
      <circle cx="18" cy="18" r="14" fill="none"/>
      <path d="M10 16 C14 22 22 22 26 16"/>
    </g>
    <!-- tomato -->
    <g transform="translate(500 360) rotate(14)">
      <circle cx="16" cy="18" r="12" fill="none"/>
      <path d="M12 8 C16 4 20 4 24 8"/>
    </g>
    <!-- wine glass -->
    <g transform="translate(60 420) rotate(-10)">
      <path d="M16 8 L10 24 H22 L16 8 Z" fill="none"/>
      <path d="M16 24 V34"/>
      <path d="M10 34 H22"/>
    </g>
    <!-- whisk -->
    <g transform="translate(260 320) rotate(32)">
      <path d="M8 34 L20 10"/>
      <path d="M18 12 C22 8 26 8 28 12"/>
      <path d="M20 14 C24 10 28 10 30 14"/>
    </g>
    <!-- cheese -->
    <g transform="translate(640 480) rotate(-14)">
      <path d="M8 30 L28 10 L38 30 Z" fill="none"/>
      <circle cx="20" cy="22" r="2" fill="#e85c1a" stroke="none"/>
      <circle cx="26" cy="18" r="2" fill="#e85c1a" stroke="none"/>
    </g>
    <!-- bread -->
    <g transform="translate(140 560) rotate(6)">
      <path d="M6 20 C10 10 38 10 42 20 C38 30 10 30 6 20 Z" fill="none"/>
    </g>
    <!-- pasta fork -->
    <g transform="translate(360 500) rotate(-6)">
      <path d="M20 8 V34"/>
      <path d="M14 8 V18 M17 8 V20 M20 8 V22 M23 8 V20 M26 8 V18"/>
    </g>
    <!-- chili -->
    <g transform="translate(520 560) rotate(20)">
      <path d="M20 8 C12 16 12 28 20 34 C28 28 28 16 20 8 Z" fill="none"/>
      <path d="M20 8 C22 4 24 4 26 8"/>
    </g>
    <!-- second row scattered -->
    <g transform="translate(220 620) rotate(-18)">
      <path d="M8 36 L28 8 L48 36 Z" fill="none"/>
      <circle cx="24" cy="26" r="2" fill="#b21e23" stroke="none"/>
    </g>
    <g transform="translate(680 640) rotate(10)">
      <path d="M18 8 L28 34 L8 34 Z" fill="none"/>
      <path d="M8 34 C8 40 28 40 28 34"/>
    </g>
  </g>
  <!-- orange accent icons -->
  <g stroke="#e85c1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <g transform="translate(680 40) rotate(-22)">
      <path d="M6 20 C10 10 38 10 42 20 C38 30 10 30 6 20 Z" fill="none"/>
    </g>
    <g transform="translate(40 620) rotate(12)">
      <circle cx="16" cy="18" r="12" fill="none"/>
    </g>
    <g transform="translate(300 240) rotate(-8)">
      <rect x="4" y="14" width="40" height="14" rx="7" fill="none"/>
    </g>
    <g transform="translate(580 120) rotate(16)">
      <path d="M8 36 L28 8 L48 36 Z" fill="none"/>
    </g>
  </g>
