<app-page-hero
  [title]="title"
  eyebrow="Sicitalia"
  subtitle="INFORMATIONEN & RECHTLICHES"
  [image]="images.hero"
  bgPosition="18% 12%"
/>

<section class="page-body">
  <div class="container">
    <div class="glass-panel legal-content" appScrollReveal>
      <p>
        Diese Seite wird derzeit aktualisiert. Für Fragen zu „{{ title }}" wenden Sie sich bitte
        direkt an unser Team.
      </p>
      <p>
        <strong>E-Mail:</strong>
        <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
      </p>
      <p><strong>Telefon:</strong> {{ contact.phone }}</p>
      <p><strong>Adresse:</strong> {{ contact.name }}, {{ contact.address }}</p>
    </div>
  </div>
</section>
