<!-- ═══ HERO – Carmelo als Hintergrund, Header transparent darüber ═══ -->
<section class="hero">
  <div class="hero-backdrop" aria-hidden="true">
    <div class="hero-backdrop-photo" [style.background-image]="'url(' + images.hero + ')'"></div>
    <div class="hero-backdrop-shade"></div>
    <div class="hero-backdrop-rings"></div>
  </div>

  <div class="container hero-content">
    <div class="hero-copy" appScrollReveal appReveal="right" [appScrollRevealDelay]="100">
      <p class="hero-eyebrow">Neu im Sortiment 2026</p>
      <h1 class="hero-headline">So schmeckt<br />der Süden.</h1>
      <p class="hero-tagline">
        LA PERFETTA PIZZABASEN &amp; SIZILIANISCHE KLASSIKER FÜR DEINE GASTRO!
      </p>
      <a routerLink="/produkte" class="btn-split">
        <span class="btn-split-label">Entdecken</span>
        <span class="btn-split-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </span>
      </a>
      <a routerLink="/termin" class="hero-secondary-link">Persönliche Beratung mit Carmelo →</a>
    </div>
  </div>
</section>
