<section class="page-hero">
  <div class="page-hero-bg" aria-hidden="true">
    <div
      class="page-hero-photo"
      [style.background-image]="'url(' + image() + ')'"
      [style.background-position]="bgPosition()"
    ></div>
    <div class="page-hero-shade"></div>
  </div>

  <div class="container page-hero-inner">
    <div class="page-hero-copy" appScrollReveal appReveal="left">
      @if (eyebrow()) {
        <p class="page-hero-badge">
          <span class="page-hero-dot" aria-hidden="true"></span>
          {{ eyebrow() }}
        </p>
      }
      <h1 class="page-hero-title" [innerHTML]="title()"></h1>
      @if (subtitle()) {
        <p class="page-hero-sub">{{ subtitle() }}</p>
      }
      <ng-content />
    </div>
  </div>
</section>
